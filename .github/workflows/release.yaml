name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Force release (skip label check)"
        type: boolean
        default: false
      dry-run:
        description: "Dry run (no publish)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: photon-hq/buildspace/.github/workflows/rust-service-release.yaml@v1.3.1
    with:
      service-name: git-semantic
      binary-name: git-semantic
      crates: '["."]'
      dry-run: ${{ inputs.dry-run || false }}
      release: ${{ inputs.release || false }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
