[package]
name = "git-semantic"
version = "1.5.0"
edition = "2024"
# Let-chains, which the index and search paths use throughout.
rust-version = "1.88"
authors = ["Yan Xue"]
description = "Semantic search for git history using natural language"
license = "MIT"
repository = "https://github.com/yanxue06/git-semantic-search"
homepage = "https://github.com/yanxue06/git-semantic-search"
documentation = "https://github.com/yanxue06/git-semantic-search#readme"
readme = "README.md"
keywords = ["git", "search", "semantic", "cli", "embeddings"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "git_semantic"
path = "src/lib.rs"

[[bin]]
name = "git-semantic"
path = "src/main.rs"

[dependencies]
# Git operations
git2 = "0.21"

# ONNX Runtime for embeddings
ort = "2.0.0-rc.10"

# Numerical arrays
ndarray = "0.17"

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# Progress bars
indicatif = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "~1.3"

# Parallel processing
rayon = "1.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system utilities
directories = "6.0"

# HTTP client for downloading models
reqwest = { version = "0.13", features = ["blocking", "stream"] }

# Tokenization for text processing
tokenizers = "0.23"
clap_complete = "4.6.9"

[dev-dependencies]
tempfile = "3.8"
criterion = "0.8"

[[bench]]
name = "search"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The recall tests build HNSW graphs over thousands of embeddings. Unoptimized
# SIMD-shaped loops make that roughly 4x slower for no diagnostic benefit;
# `debug_assert!` and overflow checks still fire at this opt-level.
[profile.test]
opt-level = 2

[target."cfg(unix)".dependencies]
libc = "0.2.189"

